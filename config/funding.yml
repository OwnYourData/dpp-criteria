# Funding notice of PACE-DPP: the one place where its wording is kept.
#
# The "Funding" section of the README is written from this file and holds
# a copy of it; after changing this file, run
#
#   python3 scripts/render_funding_md.py
#
# and commit both files together. CI runs the script with --check and fails
# while the copy in the README differs from what is written here.
#
# Links are written as in Markdown, [text](url). %{component} and %{title} are
# filled in: the README names the project with its full title.
component: The DPP criteria catalogue
title: Promoting and Accelerating a Digital Product Passport based Data-Service Ecosystem
text: >-
  %{component} is part of [PACE-DPP](https://dpp-austria.at/)%{title}.
  This Lighthouse Project has been made possible by financial contributions
  from the Austrian Federal Ministry of Innovation, Mobility and Infrastructure
  ([BMIMI](https://www.bmimi.gv.at/en.html), formerly BMK), supported by the
  Austrian Research Promotion Agency (FFG) under grant number
  [917177](https://projekte.ffg.at/projekt/5128301), as well as from the German
  Federal Ministry of Research, Technology and Space (BMFTR, formerly BMWK),
  supported by the German Research Promotion Agency (DLR-PT).
