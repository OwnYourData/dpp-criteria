id: DPP-TST-001
version: 1
status: proposed
title: Schema test vector
statement: A test vector MUST validate as described in its file name.
level: MUST
basis:
- source: EN 18216:2026
  clause: "5"
  kind: harmonised-standard
target: passport
method: automated
check:
  type: resolve
  accept: text/html
  expect:
    status: [200]
    content_type: text/html
    headers:
    - { name: Vary, contains: Accept, severity: warning }
  further_requests:
  - accept: '*/*'
    severity: warning
    expect:
      status: [200]
      content_type: application/json
