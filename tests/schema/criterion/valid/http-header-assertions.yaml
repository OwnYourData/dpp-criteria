id: DPP-TST-002
version: 1
status: proposed
title: Schema test vector
statement: A test vector MUST validate as described in its file name.
level: MUST
basis:
- source: EN 18216:2026
  clause: "5"
  kind: harmonised-standard
target: service
method: automated
check:
  type: http
  steps:
  - request: { method: GET, path: "/dpps/{dppId}" }
    expect:
      status: [200]
      headers:
      - { name: Content-Type, matches: '^application/json' }
      - { name: X-Powered-By, exists: false, severity: warning }
      - { name: Cache-Control, equals: no-store }
    severity: warning
