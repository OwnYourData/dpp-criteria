id: DPP-TST-005
version: 1
status: proposed
title: Schema test vector
statement: A test vector MUST validate as described in its file name.
level: MUST
basis:
- source: EN 18216:2026
  clause: "5"
  kind: harmonised-standard
target: service
method: automated
check:
  type: http
  base_matches: '/v1/?$'
  steps:
  - request: { method: GET, path: "/dpps/{dppId}" }
    expect:
      status: [200]
      headers:
      - { name: Content-Type, matches: '^application/(ld\+)?json(;|$)' }
      json:
      - { path: '$.lastUpdated', matches: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T' }
