id: DPP-TST-150
version: 1
status: proposed
title: Schema test vector
statement: A test vector MUST validate as described in its file name.
level: MUST
basis:
- source: EN 18221:2026
  clause: "4.3"
  kind: harmonised-standard
target: service
method: automated
requires_features: [backup-provider]
check:
  type: http
  steps:
  - request: { method: GET, path: "/dppsByProductId/{productId}" }
    expect:
      status: [200]
      content_type: application/json
    compare_with_resolved: [$.digitalProductPassportId, $.lastUpdated]
