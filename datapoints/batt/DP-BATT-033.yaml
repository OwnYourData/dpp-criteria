id: DP-BATT-033
version: 1
regime: BATT
tier: regime
name: Capacity threshold for exhaustion
term: capacity threshold for exhaustion
description: >-
  Capacity threshold at which the battery is considered exhausted; the Regulation
  names it for electric vehicle batteries only.
granularity: battery model
provided_by: >-
  economic operator that places the battery on the market (Art. 77(4)); after
  preparation for re-use, repurposing or remanufacturing, or when the battery becomes
  waste, the operator named in Art. 77(7)
access: public
access_notes: >-
  Art. 77(2), second subparagraph, point (a), with Annex XIII, point 1: accessible to
  the general public.
battery_applicability:
  ev:
    status: mandatory
  lmt:
    status: not-to-be-filled
    reason: not-for-category
  industrial:
    status: not-to-be-filled
    reason: not-for-category
basis:
