id: DP-BATT-068
version: 1
regime: BATT
tier: regime
name: Number of charging and discharging cycles
term: information and data resulting from its use
description: >-
  Number of charging and discharging cycles of the battery.
granularity: individual battery
provided_by: >-
  economic operator that places the battery on the market (Art. 77(4)); after
  preparation for re-use, repurposing or remanufacturing, or when the battery becomes
  waste, the operator named in Art. 77(7)
access: restricted
access_notes: >-
  Art. 77(2), second subparagraph, point (c), with Annex XIII, point 4: accessible
  only to persons with a legitimate interest for the purposes in the third
  subparagraph of Art. 77(2). Implementing acts under Art. 77(9) specify which persons
  have a legitimate interest and to which information.
battery_applicability:
  ev:
    status: if-applicable
    note: >-
      Where such information and data result from the use of the battery.
  lmt:
    status: if-applicable
    note: >-
      Where such information and data result from the use of the battery.
  industrial:
    status: if-applicable
    note: >-
      Where such information and data result from the use of the battery.
