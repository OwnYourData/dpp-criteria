id: DP-BATT-001
version: 1
regime: BATT
tier: regime
name: Unique battery identifier
term: unique identifier
en18223_attribute: uniqueProductIdentifier
description: >-
  Unique identifier that the economic operator placing the battery on the market
  attributes to the battery; the QR code on the battery links to it and gives access
  to the battery passport.
granularity: individual battery
provided_by: >-
  economic operator that places the battery on the market (Art. 77(4)); after
  preparation for re-use, repurposing or remanufacturing, or when the battery becomes
  waste, the operator named in Art. 77(7)
access: public
access_notes: >-
  Art. 77(3) makes the battery passport accessible through the QR code that links to
  this identifier; the Regulation sets no access restriction for it.
battery_applicability:
  ev:
    status: mandatory
  lmt:
    status: mandatory
  industrial:
    status: mandatory
basis:
- source: Regulation (EU) 2023/1542 (Batteries)
  clause: Art. 77(3), first subparagraph
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2023/1542/oj
- source: "European Commission, Guidance Document: Digital Batteries Passport – data points by category, version 2.0 of 15 August 2026"
  clause: data point 1
  kind: guidance
  url: https://single-market-economy.ec.europa.eu/document/download/cd1e5e6c-4a4a-4b99-995a-49eb6916187e_en
