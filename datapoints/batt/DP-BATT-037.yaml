id: DP-BATT-037
version: 1
regime: BATT
tier: regime
name: Round trip energy efficiency at 50 % of cycle life
term: round trip energy efficiency at 50 % of cycle-life
description: >-
  Round trip energy efficiency when half of the cycle life has been reached.
