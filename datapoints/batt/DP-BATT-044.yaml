id: DP-BATT-044
version: 1
regime: BATT
tier: regime
name: Printable and downloadable instructions for use
description: >-
  Clear and readable instructions for use in a format that can be printed, downloaded
  and saved on an electronic device, so that they remain available at all times, also
  when the battery breaks down.
granularity: battery model
provided_by: >-
  economic operator that places the battery on the market (Art. 77(4)); after
  preparation for re-use, repurposing or remanufacturing, or when the battery becomes
  waste, the operator named in Art. 77(7)
access: public
access_notes: >-
  The guidance places the data point among the publicly accessible information of
  Annex XIII, point 1.
battery_applicability:
  ev:
    status: not-to-be-filled
    reason: on-hold
    note: >-
      The guidance sets the data point aside as of February 2027 until an amending act
      is adopted.
  lmt:
    status: not-to-be-filled
    reason: on-hold
    note: >-
      The guidance sets the data point aside as of February 2027 until an amending act
      is adopted.
  industrial:
    status: not-to-be-filled
    reason: on-hold
    note: >-
      The guidance sets the data point aside as of February 2027 until an amending act
      is adopted.
basis:
- source: "European Commission, Guidance Document: Digital Batteries Passport – data points by category, version 2.0 of 15 August 2026"
  clause: data point 44
  kind: guidance
  url: https://single-market-economy.ec.europa.eu/document/download/cd1e5e6c-4a4a-4b99-995a-49eb6916187e_en
notes: >-
  The guidance lists the data point as Annex XIII, point 1(t), pending the adoption of
  an amending act. The Regulation as consolidated on 13 August 2026 has no point 1(t);
  Annex XIII, point 1 ends with point (s). The data point therefore has no basis in
  the Regulation yet.
