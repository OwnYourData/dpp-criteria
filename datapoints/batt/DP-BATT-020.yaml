      To be applied in line with Art. 8 and the delegated act under it.
  lmt:
    status: not-to-be-filled
    reason: pending-delegated-act
    note: >-
      To be applied in line with Art. 8 and the delegated act under it.
  industrial:
    status: not-to-be-filled
    reason: pending-delegated-act
    note: >-
      To be applied in line with Art. 8 and the delegated act under it.
