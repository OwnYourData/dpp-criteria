id: DP-BATT-048
version: 1
regime: BATT
tier: regime
name: Dismantling information
term: dismantling information
description: >-
  Information for dismantling the battery, at least exploded diagrams of the system or
  pack with the location of the cells, the disassembly sequence, the type and number
  of fastenings to be unlocked, the tools needed, warnings where parts may be damaged,
  and the number and layout of the cells.
granularity: battery model
provided_by: >-
  economic operator that places the battery on the market (Art. 77(4)); after
  preparation for re-use, repurposing or remanufacturing, or when the battery becomes
  waste, the operator named in Art. 77(7)
access: restricted
access_notes: >-
  Art. 77(2), second subparagraph, points (b) and (c), with Annex XIII, point 2:
  accessible to notified bodies, market surveillance authorities and the Commission,
  and to persons with a legitimate interest for the purposes in the third subparagraph
  of Art. 77(2). Implementing acts under Art. 77(9) specify which persons have a
  legitimate interest and to which information.
battery_applicability:
  ev:
    status: mandatory
  lmt:
    status: mandatory
  industrial:
    status: mandatory
basis:
- source: Regulation (EU) 2023/1542 (Batteries)
  clause: Annex XIII, point 2(c)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2023/1542/oj
- source: "European Commission, Guidance Document: Digital Batteries Passport – data points by category, version 2.0 of 15 August 2026"
  clause: data point 48
  kind: guidance
