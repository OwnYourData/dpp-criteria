id: DP-BATT-039
version: 1
regime: BATT
tier: regime
name: C-rate of the cycle-life test
term: c-rate of relevant cycle-life test
description: >-
  C-rate used in the relevant cycle-life test.
granularity: battery model
provided_by: >-
  economic operator that places the battery on the market (Art. 77(4)); after
