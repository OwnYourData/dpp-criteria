id: DP-ESPR-019
version: 1
regime: ESPR
tier: delegated-act
name: Product performance information
term: information on the performance of the product in relation to product parameters (Annex I), incl. repairability score, durability score, carbon footprint, environmental footprint
description: >-
  Information on the performance of the product in relation to the product parameters
  in Annex I, including a repairability score, durability score, carbon footprint or
  environmental footprint.
granularity: as set by the delegated act
provided_by: manufacturer, where applicable using the digital tool under Art. 39(2)
access: delegated-act
access_notes: >-
  ESPR sets no access class; it is left to the delegated act (Art. 9(2)(f); Art.
  10(1)(g); Art. 11, first subparagraph, point (b)). The value is public only where it
  must also be shown on a label under Art. 16.
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Art. 7(2)(b)(i); Annex I; Art. 8, points (d) and (e)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
