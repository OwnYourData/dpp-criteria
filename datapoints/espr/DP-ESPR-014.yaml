id: DP-ESPR-014
version: 1
regime: ESPR
tier: conditional
name: Link to the original digital product passport
term: link to original digital product passport(s)
description: >-
  Link from a new digital product passport to the original passport or passports.
granularity: per digital product passport
provided_by: economic operator responsible for the new digital product passport
access: delegated-act
access_notes: >-
  Art. 11, first subparagraph, point (d) sets the duty to link, not who may access the
  link. ESPR sets no access class; it is left to the delegated act (Art. 9(2)(f); Art.
  10(1)(g); Art. 11, first subparagraph, point (b)).
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Art. 11, first subparagraph, point (d)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
