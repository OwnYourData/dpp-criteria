id: DP-ESPR-047
version: 1
regime: ESPR
tier: annex-i
name: Consumables
term: quantity, characteristics and availability of consumables
description: >-
  Quantity, characteristics and availability of consumables needed for use and
  maintenance, including yield, technical lifetime, reusability, reparability,
  remanufacturability, mass resource efficiency and interoperability.
granularity: as set by the delegated act
provided_by: manufacturer and suppliers
access: delegated-act
access_notes: >-
  ESPR does not fix the access class; the delegated act sets it (Art. 9(2)(f); Art.
  10(1)(g); Art. 11, first subparagraph, point (b)). Annex I names product parameters,
  not access rights.
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Annex I, point (l); Art. 7(2)(b)(i); Annex III, point (a)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
