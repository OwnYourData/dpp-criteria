id: DP-ESPR-042
version: 1
regime: ESPR
tier: annex-i
name: Use of energy, water and other resources
term: use or consumption of energy, water and other resources
description: >-
  Use or consumption of energy, water and other resources in one or more life cycle
  stages, including the effect of physical factors and of software and firmware updates
  on efficiency, and the impact on deforestation.
granularity: as set by the delegated act
provided_by: manufacturer and suppliers
access: delegated-act
access_notes: >-
  ESPR does not fix the access class; the delegated act sets it (Art. 9(2)(f); Art.
  10(1)(g); Art. 11, first subparagraph, point (b)). Annex I names product parameters,
  not access rights.
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Annex I, point (g); Art. 7(2)(b)(i); Annex III, point (a)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
