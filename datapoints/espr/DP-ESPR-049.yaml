id: DP-ESPR-049
version: 1
regime: ESPR
tier: annex-i
name: Carbon footprint
term: carbon footprint
description: >-
  Carbon footprint of the product.
granularity: as set by the delegated act
provided_by: manufacturer and suppliers
access: delegated-act
access_notes: >-
  ESPR does not fix the access class; the delegated act sets it (Art. 9(2)(f); Art.
  10(1)(g); Art. 11, first subparagraph, point (b)). The carbon footprint is public
  only where it is shown as a performance class or as label content under Art. 7(4) or
  Art. 16.
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Annex I, point (n); Art. 7(2)(b)(i); Annex III, point (a)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
