id: DP-ESPR-045
version: 1
regime: ESPR
tier: annex-i
name: Weight, volume and product-to-packaging ratio
term: weight and volume of the product and its packaging, and product-to-packaging ratio
description: >-
  Weight and volume of the product and its packaging, and the ratio of product to
  packaging.
granularity: as set by the delegated act
provided_by: manufacturer and suppliers
access: delegated-act
access_notes: >-
  ESPR does not fix the access class; the delegated act sets it (Art. 9(2)(f); Art.
  10(1)(g); Art. 11, first subparagraph, point (b)). Annex I names product parameters,
  not access rights.
basis:
