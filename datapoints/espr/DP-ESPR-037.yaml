id: DP-ESPR-037
version: 1
regime: ESPR
tier: annex-i
name: Ease of repair and maintenance
term: ease of repair and maintenance
description: >-
  Ease of repair and maintenance, for example characteristics, availability, delivery
  time and affordability of spare parts, modularity, availability of repair and
  maintenance instructions, tool requirements, non-destructive disassembly, and access
  to product data, hardware and software.
granularity: as set by the delegated act
provided_by: manufacturer and suppliers
access: delegated-act
access_notes: >-
  ESPR does not fix the access class; the delegated act sets it (Art. 9(2)(f); Art.
  10(1)(g); Art. 11, first subparagraph, point (b)). Annex I names product parameters,
  not access rights.
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Annex I, point (b); Art. 7(2)(b)(i); Annex III, point (a)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
