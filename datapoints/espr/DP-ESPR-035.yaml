regime: ESPR
tier: delegated-act
name: Reference to the back-up service provider
term: reference to back-up digital product passport service provider
description: >-
  Reference to the independent third-party service provider that stores the back-up
  copy of the digital product passport.
granularity: per digital product passport
provided_by: economic operator
access: delegated-act
access_notes: >-
  Annex III, first paragraph, point (l); Art. 10(4). ESPR does not fix the access
  class; the delegated act sets it (Art. 9(2)(f); Art. 10(1)(g); Art. 11, first
  subparagraph, point (b)).
