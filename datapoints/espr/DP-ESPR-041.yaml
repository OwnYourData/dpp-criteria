id: DP-ESPR-041
version: 1
regime: ESPR
tier: annex-i
name: Use of substances
term: use of substances, in particular substances of concern
description: >-
  Use and presence of substances, in particular substances of concern, also when the
  product becomes waste, and their impact on human health and the environment.
granularity: as set by the delegated act
provided_by: manufacturer and suppliers
access: delegated-act
access_notes: >-
  Annex I, point (f) covers substances. Where the information is tracking data under
  Art. 7(5), Art. 7(7), second subparagraph takes precedence, as for the substance data
  points DP-ESPR-004 to DP-ESPR-012. Otherwise: ESPR does not fix the access class; the
  delegated act sets it (Art. 9(2)(f); Art. 10(1)(g); Art. 11, first subparagraph,
  point (b)).
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Annex I, point (f); Art. 7(2)(b)(i); Annex III, point (a)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
