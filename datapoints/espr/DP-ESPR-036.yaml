id: DP-ESPR-036
version: 1
regime: ESPR
tier: annex-i
name: Durability and reliability
term: durability and reliability
description: >-
  Durability and reliability of the product, for example guaranteed lifetime, technical
  lifetime, mean time between failures, information on actual use, and resistance to
  stresses or ageing.
granularity: as set by the delegated act
provided_by: manufacturer and suppliers
access: delegated-act
access_notes: >-
  ESPR does not fix the access class; the delegated act sets it (Art. 9(2)(f); Art.
  10(1)(g); Art. 11, first subparagraph, point (b)). Annex I names product parameters,
  not access rights.
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Annex I, point (a); Art. 7(2)(b)(i); Annex III, point (a)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
