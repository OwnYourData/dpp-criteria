id: DP-ESPR-027
version: 1
regime: ESPR
tier: delegated-act
name: Commodity code
term: commodity code (e.g. TARIC)
description: >-
  Commodity code of the product.
granularity: model
provided_by: economic operator
access: delegated-act
access_notes: >-
  In the registry, Art. 13(1), second subparagraph, in conjunction with Art. 13(6)
  gives access to the Commission, competent national authorities and customs
  authorities, and customs check the code under Art. 15(2). For the passport (Annex
  III, point (d)), ESPR sets no access class; it is left to the delegated act (Art.
  9(2)(f); Art. 10(1)(g); Art. 11, first subparagraph, point (b)).
