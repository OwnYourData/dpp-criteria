id: DPP-CAR-002
version: 3
status: proposed
title: Product identifier follows an EN 18219 product scheme
statement: >-
  The unique product identifier MUST follow one of the product ID schemes of EN
  18219, and a GS1 Digital Link SHOULD NOT carry a GTIN with the GS1 prefix 952,
  which GS1 sets aside for demonstrations and examples.
level: MUST
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Art. 10(1)(c)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
- source: EN 18219:2026
  clause: 4.3.2, Clause 5, 5.2.2.1 f) and g)
  kind: harmonised-standard
- source: EN 18220:2026
  clause: 5.2.2
  kind: harmonised-standard
- source: GS1 Prefixes, list of the GS1 Global Office
  kind: guidance
  url: https://www.gs1.org/prefixes
target: passport
method: automated
requires_features: []
check:
  type: shacl
  structure: DigitalProductPassport
catalogue_ref:
- DPP-CAR-002
- DPP-ID-043
- DPP-INT-007
notes: >-
  Checked in the SOyA structure DigitalProductPassport by syntax: HTTPS URL
  (schemes 1, 2 and 5), DID (scheme 3) or RFID/2D encoding (scheme 4). Only the
  identifier is checked; conformity of the physical data carrier (EN 18220)
  cannot be observed. A GS1 Digital Link whose GTIN after /01/ carries the GS1
  prefix 952 gives a warning: GS1 uses this prefix for demonstrations and
  examples, so the GTIN is not assigned under a GS1 Company Prefix, and the global
  uniqueness that EN 18219 5.2.2.1 f) and g) expect for scheme 1 is not ensured.
  The GTIN is read in each of its lengths, padded with leading zeros or not: a
  GTIN-13 carries the prefix in its first three digits, a GTIN-14 in the three
  digits after the indicator digit, and a GTIN-8 as its GS1-8 prefix, its first
  three digits (also when padded to 12, 13 or 14 digits); a GTIN-12 cannot carry
  it, because read as a GTIN-13 it starts with 0. A demonstration passport gets
  this warning on purpose.
