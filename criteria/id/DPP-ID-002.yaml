id: DPP-ID-002
version: 3
status: proposed
title: Product identifier stays resolvable over time
statement: >-
  The unique product identifier MUST keep resolving to its passport for as long
  as the passport has to be available.
level: MUST
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Art. 9(2)(i); Art. 10(1)(a); Art. 11, point (e)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
- source: EN 18219:2026
  clause: 4.2.2 (2), (3)
  kind: harmonised-standard
- source: EN 18221:2026
  clause: '4.1'
  kind: harmonised-standard
target: passport
method: automated
requires_features: []
check:
  type: resolve
  history:
    criterion: DPP-ID-001
    period_days: 30
    fail_after_consecutive_runs: 3
catalogue_ref:
- DPP-ID-002
- DPP-ID-022
- DPP-BCK-012
- DPP-BCK-003
notes: >-
  The validator keeps one run per day and entry, the last one of that day. Entries
  of operators are run daily, entries from our research weekly, so 3 consecutive
  runs are 3 days or 3 weeks. A run in which DPP-ID-001 has no result (skipped, or
  dpplint not reachable) is left out. A single linter run does not rate this
  criterion (see DPP-ID-001).
