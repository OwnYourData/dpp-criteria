id: DPP-ID-009
version: 1
status: proposed
title: Economic operator identifier follows an EN 18219 scheme
statement: >-
  Where an economic operator identifier is required, it MUST follow one of the ID
  schemes for economic operators in EN 18219.
level: MUST
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Annex III (g), (h), (k)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
- source: EN 18219:2026
  clause: '6.1'
  kind: harmonised-standard
target: passport
method: automated
requires_features: []
applies_if:
- path: $.economicOperatorId
  exists: true
check:
  type: identifier
  path: $.economicOperatorId
  schemes:
  - iso-iec-6523
  - iso-iec-15418
  - did
  - doi
catalogue_ref: DPP-ID-009
notes: >-
  Whether the identifier is present is checked by DPP-ROL-016; DID-specific requirements
  by DPP-ID-016. The EU DPP registry accepts only NTR, LEI, VAT and eID identifiers
  for economic operators.
