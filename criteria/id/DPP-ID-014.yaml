id: DPP-ID-014
version: 1
status: proposed
title: Product identifier is a URL or convertible to one
statement: >-
  The unique product identifier MUST be a URL or be convertible into a URL by a
  specified method.
level: MUST
basis:
- source: EN 18219:2026
  clause: 4.3.2 (2)
  kind: harmonised-standard
target: passport
method: automated
requires_features: []
check:
  type: shacl
  structure: DigitalProductPassport
notes: >-
  Checked in the SOyA structure DigitalProductPassport by syntax: an HTTP(S) URL,
  a DID (resolved by DID Resolution), an EPC URN (converted per the GS1 EPC Tag
  Data Standard) or an ISO/IEC 15434 message (converted per ISO/IEC 18975).
