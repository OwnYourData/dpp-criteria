id: DPP-DAT-003
version: 3
status: active
title: Passport is delivered as structured JSON
statement: >-
  DPP data MUST be machine-readable and structured, delivered as a JSON object based
  on open standards.
level: MUST
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Art. 10(1)(d)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
- source: EN 18216:2026
  clause: 5 a), 5 c)
  kind: harmonised-standard
- source: EN 18223:2026
  clause: 5.2.4
  kind: harmonised-standard
target: passport
method: automated
requires_features: []
check:
  type: resolve
  accept: application/json
  expect:
    status:
    - 200
    content_type: application/json
    content_type_with_warning:
    - application/ld+json
catalogue_ref:
- DPP-DAT-003
- DPP-DAT-001
- DPP-DAT-002
- DPP-DAT-004
- DPP-DEX-007
- DPP-DAT-036
notes: >-
  The response has to parse as a single JSON object. Attribute names are checked
  by DPP-DAT-014. The request states Accept application/json: the criterion asks
  whether the passport is available as JSON, not which format a client without a
  stated preference receives; that is assessed by DPP-DAT-016. EN 18216 Clause 5
  makes JSON the required format and allows JSON-LD in addition through content
  negotiation, as long as a plain JSON parser can read it. A single JSON object
  delivered as application/ld+json to a request for application/json therefore
  passes with a warning: the content is JSON, but the request for
  application/json is not honoured.
