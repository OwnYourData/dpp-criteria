id: DPP-DAT-016
version: 3
status: active
title: Passport is available as HTML
statement: >-
  A DPP MUST also be provided as HTML through HTTP content negotiation.
level: MUST
basis:
- source: EN 18216:2026
  clause: 5 a), 5 d)
  kind: harmonised-standard
- source: RFC 9110
  clause: 12.5.5
  kind: standard
  url: https://www.rfc-editor.org/rfc/rfc9110.html#name-vary
- source: RFC 9110
  clause: 12.5.1
  kind: standard
  url: https://www.rfc-editor.org/rfc/rfc9110.html#name-accept
target: passport
method: automated
requires_features: []
check:
  type: resolve
  accept: text/html
  expect:
    status:
    - 200
    content_type: text/html
    headers:
    - name: Vary
      contains: Accept
      severity: warning
  further_requests:
  - accept: '*/*'
    severity: warning
    expect:
      status:
      - 200
      content_type: application/json
  - accept: application/json, text/html;q=0.1
    severity: warning
    expect:
      status:
      - 200
      content_type: application/json
notes: >-
  Only the HTML request decides pass or fail. Three further checks give at most a
  warning. (1) The HTML response lists Accept in its Vary header (RFC 9110
  12.5.5), so that caches do not hand the HTML variant to JSON clients or the
  other way round; "Vary: *" does not count. (2) A request with Accept */* still
  returns application/json: JSON is the required format of EN 18216 Clause 5 and
  HTML is added only through content negotiation, so a client that states no
  preference keeps receiving JSON. (3) A request that prefers JSON and accepts
  HTML only with a low quality value (RFC 9110 12.5.1) returns application/json,
  so that the service weighs quality values instead of only looking for media
  types in the header. The accessibility requirements of the same
  clause (EN 301 549) are not checked automatically.
