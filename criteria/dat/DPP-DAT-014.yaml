id: DPP-DAT-014
version: 1
status: proposed
title: Passport header uses the EN 18223 attributes
statement: >-
  A DPP MUST carry the attributes of the DigitalProductPassport class under their
  published names, including all mandatory ones (digitalProductPassportId, uniqueProductIdentifier,
  granularity, dppSchemaVersion, dppStatus, lastUpdated, economicOperatorId).
level: MUST
basis:
- source: EN 18223:2026
  clause: 4.1.2.1, Table 1; 5.2.2
  kind: harmonised-standard
target: passport
method: automated
requires_features: []
check:
  type: shacl
  structure: DigitalProductPassport
catalogue_ref:
- DPP-CRT-009
- DPP-DAT-007
- DPP-DAT-009
notes: >-
  facilityId is optional (0..1), contentSpecificationIds may repeat (0..*). lastUpdated
  is an ISO 8601 UTC timestamp. dppStatus is a free string; values outside the examples
  active, inactive, archived, invalid give a warning, independent of capitalisation.
  dppSchemaVersion and contentSpecificationIds are strings and are not resolved.
  A passport ID that is not a URI gives a warning. Draft-era names (ProductID, DPPStatus,
  …) fail because the published attribute is missing.
