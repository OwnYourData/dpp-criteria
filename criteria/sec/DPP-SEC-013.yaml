id: DPP-SEC-013
version: 2
status: proposed
title: Integrity proof is issued by the economic operator
statement: >-
  The integrity proof of a DPP SHOULD be issued with a key of the responsible
  economic operator or its authorised representative.
level: SHOULD
basis:
- source: EN 18246:2026
  clause: Annex A, A.3
  kind: standard
- source: EN 18219:2026
  clause: 6.4.1
  kind: harmonised-standard
target: passport
method: automated
requires_features: []
check:
  type: proof
  key_from: $.economicOperatorId
  formats:
  - vc-data-integrity
  - vc-jose-cose
  - did-oyd-log
catalogue_ref:
- DPP-SEC-004
- DPP-SEC-048
- DPP-SEC-027
notes: >-
  EN 18246:2026 Annex A (normative), A.3, names the economic operator placing
  the product on the market as the typical issuer of core passport data and
  describes the DPP signed data construct as carrying the electronic signature
  of the responsible economic operator or its authorised representative;
  EN 18219:2026 6.4.1 describes economic operator DIDs as the means to sign
  passports, with the public key in the DID document. Passed if at least one proof
  verified under DPP-SEC-002 is issued with a key of the DID in economicOperatorId.
  A proof by another key gives a warning, because an authorised representative
  cannot be recognised automatically. For did-oyd-log the content is attested with
  the key of the passport identifier, which is not linked to the economic
  operator, so it gives a warning. Without a verified proof, or if
  economicOperatorId is not a DID, the result is skipped. The level stays
  SHOULD because other authorised actors may sign attestations and an
  authorised representative cannot be recognised automatically.
