id: DPP-SEC-001
version: 2
status: active
title: Passport cannot be changed without authorisation
statement: >-
  A DPP service MUST reject attempts to create or change passports without valid
  authorisation.
level: MUST
basis:
- source: EN 18221:2026
  clause: '4.1'
  kind: harmonised-standard
- source: EN 18222:2026
  clause: 4.6, 4.7, 4.8, Table 15
  kind: harmonised-standard
target: service
method: automated
requires_features: []
check:
  type: http
  steps:
  - request:
      method: GET
      path: /dpps/{dppId}
      auth: none
    expect:
      status:
      - 200
  - request:
      method: PATCH
      path: /dpps/{dppId}
      auth: none
      headers:
        Content-Type: application/json
      body: {}
    expect:
      status:
      - 400
      - 401
      - 403
      - 404
      - 405
      - 501
  - request:
      method: POST
      path: /dpps
      auth: none
      headers:
        Content-Type: application/json
      body: {}
    expect:
      status:
      - 400
      - 401
      - 403
      - 404
      - 405
      - 501
  - request:
      method: GET
      path: /dpps/{dppId}
      auth: none
    expect:
      status:
      - 200
      body_equals_step: 1
catalogue_ref:
- DPP-SEC-001
- DPP-API-005
notes: >-
  The PATCH body changes nothing, so a wrongly accepted request leaves the test
  passport intact. No DELETE is sent against the test passport. Steps 2 and 3
  accept every client error of EN 18222 Table 15 that refuses the request without
  creating or changing anything (400, 401, 403, 404, 405) and 501, because a
  service without a write API may reject the empty body or the route before any
  authorisation check. Whether the passport stayed unchanged is decided by step 4.
