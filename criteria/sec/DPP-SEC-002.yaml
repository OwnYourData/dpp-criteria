id: DPP-SEC-002
version: 3
status: active
title: Integrity of the passport version is verifiable
statement: The integrity of a DPP version MUST be verifiable.
level: MUST
basis:
- source: Implementing Regulation (EU) 2026/1778 (DPP registry)
  clause: Art. 2 (hash of the version); Art. 8(9)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg_impl/2026/1778/oj
- source: EN 18221:2026
  clause: 4.1, 4.2
  kind: harmonised-standard
- source: EN 18246:2026
  clause: 4.1, 4.7
  kind: standard
target: passport
method: automated
requires_features: []
check:
  type: proof
  formats:
  - vc-data-integrity
  - vc-jose-cose
  - did-oyd-log
catalogue_ref:
- DPP-SEC-002
- DPP-BAT-008
notes: >-
  EN 18221:2026 requires DPP service providers to ensure the integrity and
  authenticity of stored passports and of archived versions, following EN 18246.
  EN 18246:2026 4.1 requires DPP data to be protected against unauthorised
  modification and attributable to a verifiable source, by mechanisms that do
  not depend on the security of the transport channel; 4.7 requires a DPP to be
  verifiable in integrity and authenticity, free of charge and without
  limitations for the verifier. Every proof found is verified
  with the key it names (verificationMethod, JWS kid) or, for did-oyd-log, against
  the payloadHash in the DID document of the passport identifier; who holds the
  key is assessed in DPP-SEC-013. Only the current version is checked. Without a
  proof the result is skipped, because verification may rely on means that are
  not visible in the response. The version hash under Art. 8(9) of the
  Implementing Regulation is held by the EU DPP registry, which has no public API.
