id: DPP-ACC-012
version: 2
status: proposed
title: Fine-granular read of a controlled element without credentials is refused
statement: >-
  A DPP service MUST refuse a fine-granular read of a controlled data element
  that is sent without credentials. It SHOULD answer with 401 and a
  WWW-Authenticate header field.
level: MUST
basis:
- source: EN 18239:2026
  clause: 5.2 (22), 6.2
  kind: standard
- source: EN 18222:2026
  clause: 6.2, 7.2, Table 15
  kind: harmonised-standard
- source: RFC 9110
  clause: 15.5.2
  kind: standard
  url: https://www.rfc-editor.org/rfc/rfc9110.html#name-401-unauthorized
target: service
method: automated
requires_features:
- access-levels
- fine-granular-api
check:
  type: http
  steps:
  - request:
      method: GET
      path: /dpps/{dppId}/elements/{controlledElementIdPath}
      auth: none
    warn_if_status:
    - 403
    expect:
      status:
      - 401
      headers:
      - name: WWW-Authenticate
        exists: true
        severity: warning
catalogue_ref: DPP-ACC-001
notes: >-
  ReadDataElement (EN 18222 6.2) addresses one element directly, so there is no
  public part to fall back on. EN 18222 Table 15 maps credentials that are
  absent or invalid to ClientNotAuthorized (401) and a denied authorisation to
  ClientForbidden (403). A request without credentials is the case of absent
  credentials, so 401 passes. 403 still refuses the read and gives a warning,
  because the table provides 401 for this case. 200 fails, and so does 404,
  because it does not tell a refused read from a missing element. RFC 9110
  15.5.2 requires every 401 to carry a WWW-Authenticate header field with at
  least one challenge; a 401 without it gives a warning. EN 18222 names no
  authentication scheme, so the check asks for the header field only, not for a
  particular scheme. The test data names the JSONPath of the controlled element
  in the compressed representation (test_data.controlledElementIdPath).
