id: DPP-API-007
version: 2
status: active
title: Errors use the EN 18222 status codes
statement: >-
  A DPP service MUST answer faulty requests with the status codes of EN 18222 and
  MUST NOT answer them with a server error.
level: MUST
basis:
- source: EN 18222:2026
  clause: 7.2, Table 15
  kind: harmonised-standard
target: service
method: automated
requires_features: []
check:
  type: http
  steps:
  - request:
      method: POST
      path: /dppsByProductIds
      auth: none
      headers:
        Content-Type: application/json
      body: '{not json'
    expect:
      status:
      - 400
  - request:
      method: POST
      path: /dppsByProductIds
      auth: none
      headers:
        Content-Type: application/json
      body:
        productId: 42
    expect:
      status:
      - 400
catalogue_ref: DPP-API-007
notes: >-
  Checks malformed requests to ReadDPPIdsByProductIds. The answer to an unknown
  passport ID (404) is checked by DPP-API-022, so that it is also assessed in a
  read-only run.
