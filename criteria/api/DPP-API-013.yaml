id: DPP-API-013
version: 1
status: proposed
title: Lifecycle API provides ReadDPPById
statement: >-
  The DPP lifecycle API MUST provide the method ReadDPPById.
level: MUST
basis:
  - source: EN 18222:2026
    clause: "4.2"
    kind: harmonised-standard
target: service
method: automated
requires_features: []
check:
  type: http
  steps:
    - request: { method: GET, path: "/dpps/{dppId}", auth: none }
      expect:
        status: [200]
        content_type: application/json
        json:
          - { path: "$.digitalProductPassportId", equals: "{dppId}" }
catalogue_ref: DPP-API-013
