id: DPP-API-020
version: 1
status: proposed
title: API paths carry the version prefix v1/
statement: The paths of the DPP API MUST carry the version prefix v1/.
level: MUST
basis:
- source: EN 18222:2026
  clause: 8.1, Tables 16–18
  kind: harmonised-standard
target: service
method: automated
requires_features: []
check:
  type: http
  base_matches: /v1/?$
  steps:
  - request:
      method: GET
      path: /dpps/{dppId}
      auth: none
    expect:
      status:
      - 200
catalogue_ref: DPP-API-011
notes: Later API versions replace the prefix accordingly.
