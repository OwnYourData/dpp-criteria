id: DPP-ROL-016
version: 1
status: proposed
title: Passport names its economic operator
statement: >-
  A DPP MUST identify the responsible economic operator in the attribute economicOperatorId.
level: MUST
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Annex III (g), (h), (k)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
- source: EN 18223:2026
  clause: 4.1.2.1, Table 1
  kind: harmonised-standard
target: passport
method: automated
requires_features: []
check:
  type: shacl
  structure: DigitalProductPassport
catalogue_ref: DPP-ROL-016
notes: >-
  Checked in the SOyA structure DigitalProductPassport. The syntax of the
  identifier is checked by DPP-ID-009, DID-specific requirements by DPP-ID-016.
