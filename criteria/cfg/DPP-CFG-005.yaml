id: DPP-CFG-005
version: 1
status: proposed
title: Granularity matches the product identifier
statement: >-
  The granularity of a DPP MUST match the level (model, batch or item) that its
  unique product identifier identifies.
level: MUST
basis:
- source: Regulation (EU) 2024/1781 (ESPR)
  clause: Art. 9(2)(d)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2024/1781/oj
- source: EN 18223:2026
  clause: 4.1.2.2
  kind: harmonised-standard
- source: EN 18219:2026
  clause: 4.4.2 (1), 5.2.2.1
  kind: harmonised-standard
target: passport
method: automated
requires_features: []
check:
  type: shacl
  structure: DigitalProductPassport
catalogue_ref: DPP-CFG-005
notes: >-
  Checked in the SOyA structure DigitalProductPassport for identifiers in GS1
  Digital Link form (ID scheme 1, EN 18219 5.2.2.1): /21/ means item, /10/ batch,
  otherwise model. Other schemes do not encode the level and are not rated. The
  allowed values are checked by DPP-DAT-015.
