id: DPP-BAT-004
version: 2
status: proposed
title: Battery passport releases Annex XIII point 3 data only to authorities
statement: >-
  A DPP service for battery passports MUST release the information of Annex XIII
  point 3 of the Batteries Regulation only to notified bodies, market surveillance
  authorities and the Commission, and not to persons with a legitimate interest
  or the public.
level: MUST
basis:
- source: Regulation (EU) 2023/1542 (Batteries)
  clause: Art. 77(2), (6); Annex XIII (3)
  kind: regulation
  url: https://eur-lex.europa.eu/eli/reg/2023/1542/oj
- source: EN 18239:2026
  clause: 5.2 (7)
  kind: standard
target: service
method: automated-auth
requires_features:
- battery
- access-levels
check:
  type: http
  steps:
  - request:
      method: GET
      path: /dpps/{dppId}
      auth: none
    expect:
      status:
      - 200
      content_type: application/json
      json:
      - path: $..['{controlledElementId}']
        exists: false
  - request:
      method: GET
      path: /dpps/{dppId}
      auth: token
      role: legitimate-interest
    expect:
      status:
      - 200
      content_type: application/json
      json:
      - path: $..['{controlledElementId}']
        exists: false
  - request:
      method: GET
      path: /dpps/{dppId}
      auth: token
      role: authority
    expect:
      status:
      - 200
      content_type: application/json
      json:
      - path: $..['{controlledElementId}']
        exists: true
catalogue_ref:
- DPP-BAT-004
- DPP-BAT-007
- DPP-BAT-001
notes: >-
  Article 77(2) of the Batteries Regulation sorts the battery passport
  information into three access groups: the public (Annex XIII point 1);
  notified bodies, market surveillance authorities and the Commission (points 2
  and 3); and persons with a legitimate interest (points 2 and 4). Point 3, the
  results of test reports proving compliance, is the only part reserved for the
  authorities and the Commission. EN 18239:2026 5.2 (7) leaves such roles to the
  legal act of the product group. For battery services the test passport is a
  battery passport and the controlled test element
  (test_data.controlledElementId) is an element of point 3. The operator
  provides test tokens for the roles "legitimate-interest" and "authority". Which
  persons have a legitimate interest, and to which information of points 2 and 4,
  is specified by implementing acts under Article 77(9); DPP-ACC-003 checks the
  delivery of a controlled element per role in general. DPP-BAT-002 checks the
  public data of point 1.
