id: DPP-INT-005
version: 1
status: proposed
title: Passport body follows the EN 18223 data model
statement: >-
  The data elements of a DPP MUST follow the semantic model and the serialization
  of EN 18223.
level: MUST
basis:
- source: EN 18223:2026
  clause: 4.1.2.3–4.1.2.9, 5.2
  kind: harmonised-standard
target: passport
method: automated
requires_features: []
check:
  type: shacl
  structure: DigitalProductPassport
catalogue_ref: DPP-INT-005
notes: >-
  Covers the DataElement classes (objectType), the attributes of Tables 2 to 6 and
  the value types of Table 7 in the expanded full serialization (Annex A). Whether
  an elementId is unique at its level is not checked: SOyA validates with SHACL
  Core, which cannot compare sibling nodes. Passports in the compressed
  serialization (5.2.5 to 5.2.9) are skipped until a structure for that form
  exists. Header attributes are checked by DPP-DAT-014.
