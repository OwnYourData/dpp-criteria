id: DPP-DEX-006
version: 1
status: active
title: HTTP versions below HTTP/2 are not used
statement: >-
  DPP communication MUST NOT use HTTP versions older than HTTP/2.
level: MUST
basis:
- source: EN 18216:2026
  clause: '4'
  kind: harmonised-standard
target: service
method: automated
requires_features: []
check:
  type: tls
  http_versions:
    reject:
    - '1.0'
    - '1.1'
notes: >-
  Checked on the HTTPS port of the API base only; port 80 (redirect to HTTPS,
  ACME HTTP-01) is not tested and stays covered by DPP-DEX-002. A request forced
  to HTTP/1.0 or HTTP/1.1 over TLS counts as rejected if it gets no successful
  response: aborted connection or TLS handshake, or a status of 400 or higher.
  A 2xx or 3xx answer at either version fails the criterion. Recommended answer:
  refuse HTTP/1.x already in the TLS handshake (ALPN offers only h2), or answer
  400 (ClientErrorBadRequest) with the result object of EN 18222. 505 HTTP Version
  Not Supported is not recommended, since it is not among the status codes that
  EN 18222:2026 Table 15 allows. See the tls check type in CRITERIA-FORMAT.md.
