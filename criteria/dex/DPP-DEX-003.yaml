id: DPP-DEX-003
version: 1
status: proposed
title: TLS 1.2 or higher, older versions refused
statement: >-
  DPP communication MUST support at least TLS 1.2 and MUST NOT accept TLS 1.0, TLS
  1.1 or any SSL version.
level: MUST
basis:
- source: EN 18216:2026
  clause: '4'
  kind: harmonised-standard
target: service
method: automated
requires_features: []
check:
  type: tls
  min_version: '1.2'
  reject_versions:
  - ssl3
  - '1.0'
  - '1.1'
  recommend_versions:
  - '1.3'
catalogue_ref: DPP-DEX-003
notes: TLS 1.3 is recommended; its absence gives a warning.
