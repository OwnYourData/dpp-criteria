declarations:
  - criterion: DPP-ACC-008
    statement: >-
      An access policy, registered by the economic operator once per product type
      and named when a passport is created or updated, assigns every data element of
      the passport exactly one of the access classes public, legitimateInterest and
      authority; header attributes are always public, and an element no rule reaches
      falls to the policy's default or, without one, to authority. A registered
      policy never changes; a new version is registered under a new identifier.
      Readers, identified by their DID, receive access rights through signed access
      grants that last at most 365 days: legitimateInterest is granted by the
      economic operator for its own passports, authority only by issuers on the
      published list of authority issuers. The issuer revokes a grant over the API
      with immediate effect. In addition, the operator of the service can revoke any
      grant on order, with a recorded reason, and can withdraw an authority issuer as
      a whole by removing it from that list.
    evidence: https://github.com/OwnYourData/dpp-service-public/blob/a42359ecdf33913bb6afc3164d0e4af40f60be19/docs/AccessClasses.md#7-access-grants
  - criterion: DPP-ACC-014
    statement: >-
      The service keeps an access log with one entry for every read of the
      controlled part of a passport by a reader with access rights, every refused
      read by a reader with a valid token but no valid grant, every read the service
      makes at the custodian under its own read grant, and every registration and
      revocation of an access grant. An answer that hands out controlled data is sent
      only after its entry is written. Entries are only ever added; the service
      neither changes nor deletes them, the database refuses changes and deletions,
      and entries are kept for five years. Owners, readers and grant issuers read the
      entries that concern them through the API; the operator of the service sees the
      whole log. The log protects against changes made through the service, not
      against direct changes to its database.
    evidence: https://github.com/OwnYourData/dpp-service-public/blob/a42359ecdf33913bb6afc3164d0e4af40f60be19/docs/AccessClasses.md#10-access-log
  - criterion: DPP-ACC-015
    statement: >-
      Every party that authenticates to the service is identified by a W3C
      Decentralized Identifier: economic operators that write passports, readers of
      the controlled part and issuers of access grants. Each presents a self-issued
      JWT (EdDSA) signed with the document key of its own did:oyd, with iss and sub
      set to that DID, this service as aud, and a lifetime of at most 15 minutes and
      is accepted once; the service resolves the DID and verifies the signature
      against the key in its DID document. There are no local accounts, shared logins
      or shared secrets. A did:oyd is the hash of its own DID document and therefore
      unique without a central registry. Passport ownership, access grants and every
      entry of the access log are keyed by this DID, and towards a custodian the
      service authenticates with its own DID in the same way, with a delegation
      signed by the economic operator, a client assertion and DPoP. Tokens are
      verified with DPP_AUTH_MODE=did, as on the hosted instance; a stand-alone
      instance in the default mode does not verify them. A DID proves control of a
      key, not the legal identity behind it.
    evidence: https://github.com/OwnYourData/dpp-service-public/blob/32247c815043b67e0e487292958af4c339ec0ef0/README.md#hosted-instance
  - criterion: DPP-DGA-001
    statement: >-
      The hosted instance of the service, operated by OwnYourData, keeps no passport
      documents in its own database: it stores them in a hosting pod of DID
      Daten-Intermediär-Dienste FlexCo, a separate legal person, and keeps only an
      index and the storage configuration. For economic operators, the intermediary
      holds their passports in a collection of its pod and serves the public part to
      anyone who reads it; a change of custodian moves a passport without changing
      its product identifier. DID Daten-Intermediär-Dienste FlexCo is notified in
      Austria as a provider of data intermediation services and listed in the EU
      register of data intermediation services. The role is described in the
      documentation of the service:
      https://github.com/OwnYourData/dpp-service-public/blob/8fec06ed3a108586b254fa4ba7d9a3f174c0f122/README.md#hosted-instance
    evidence: https://digital-strategy.ec.europa.eu/en/policies/data-intermediary-services
  - criterion: DPP-SEC-022
    statement: >-
      The public part of a passport is readable without credentials, as EN 18239:2026
      provides; the service limits how fast it can be harvested and keeps the
      controlled part out of reach. Reads and writes are rate-limited per client
      address and minute, by default 600 reads and 60 writes, counted in the database
      all replicas share, and answered above the limit with 429 and Retry-After. No
      operation lists passports: a read needs a passport identifier, a did:oyd that
      cannot be guessed, or a product identifier, and the bulk lookup
      ReadDPPIdsByProductIds takes at most 1000 product identifiers per request and
      returns identifiers only, at most 1000 per page. The controlled part is handed
      out only against a verified DID token and a valid access grant, and every such
      read and every refused read with a valid token is logged; a fine-granular read
      of an element path beyond the reader's access rights answers 401 without a
      token and 403 with a valid one, whether or not the element exists. Writes need
      the owner's signed token, and browsers may write only from configured origins,
      none by default. The hosted instance serves the API over HTTPS only and refuses
      HTTP versions below HTTP/2; tokens are bound to this service, live at most 15
      minutes and are accepted once, their jti being recorded until they expire, and
      DID resolution is cached, failures included, so invented DIDs cannot force
      unbounded lookups. Not covered: the rate limit is kept per client address, so
      scraping spread over many addresses is not stopped; there is no bot detection;
      product identifiers that follow a predictable series can be enumerated at the
      rate limit; and passports held by a custodian are served from the custodian's
      host under the custodian's protection, not this service's. When the service
      cannot keep the count for the rate limit, it lets requests through without the
      limit and logs a warning.
    evidence: https://github.com/OwnYourData/dpp-service-public/blob/32247c815043b67e0e487292958af4c339ec0ef0/docs/Standalone.md#3-configuration
listed_since: 2026-10-08
