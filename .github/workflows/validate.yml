name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install check-jsonschema==0.29.4
      - name: Criteria
        run: check-jsonschema --schemafile schema/criterion.schema.json criteria/*/*.yaml
      - name: Services
        run: check-jsonschema --schemafile schema/service.schema.json services/*.yaml
      - name: Schema test vectors
        run: sh scripts/test_schema.sh
      - name: File name matches id
        run: |
          fail=0
          for f in criteria/*/*.yaml services/*.yaml; do
            id=$(grep -m1 '^id:' "$f" | awk '{print $2}')
            [ "$(basename "$f" .yaml)" = "$id" ] || { echo "::error file=$f::file name does not match id $id"; fail=1; }
          done
          exit $fail

  jsonpath:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonpath-rfc9535==2.0.0 iregexp-check==0.1.4 pyyaml==6.0.2
      - name: JSONPath and match()/search() patterns of the criteria
        run: python3 scripts/check_jsonpath_patterns.py
      - name: JSONPath test vectors
        run: sh scripts/test_jsonpath_patterns.sh

  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml==6.0.2
      - name: criteria/README.md matches the criteria files
        run: python3 scripts/render_criteria_md.py --check

  structures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SOyA structures against test vectors (oydeu/soya-web-cli)
        run: sh scripts/run_structure_tests.sh
